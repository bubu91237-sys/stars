<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牧夫座双星系统 - Pulcherrima (Izar)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 320px;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fbbf24, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #d1d5db;
            margin-bottom: 4px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        button {
            flex: 1;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(56, 189, 248, 0.3);
        }
        .tips {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h1>Pulcherrima (Izar)</h1>
        <p>牧夫座ε双星系统：金黄色的橙色巨星与亮蓝绿色的伴星正围绕共同质心交织旋转。</p>
        
        <div class="control-group">
            <label><span>公转速度</span><span id="speedVal">1.0x</span></label>
            <input type="range" id="speedRange" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label><span>轨迹拖尾长度</span><span id="trailVal">中等</span></label>
            <input type="range" id="trailRange" min="50" max="400" step="10" value="200">
        </div>

        <div class="btn-row">
            <button id="pauseBtn">暂停 / 播放</button>
            <button id="resetBtn">重置视角</button>
        </div>
    </div>

    <div class="tips">提示：按住鼠标左键或用手指拖拽可旋转 3D 视角</div>

    <canvas id="spaceCanvas"></canvas>

            lastMouseY = e.clientY;

            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            rotY += dx * 0.005;
            rotX += dy * 0.005;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('touchstart', e => {
            if(e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', e => {
